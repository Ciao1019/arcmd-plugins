name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Check gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files not formatted:"
            echo "$out"
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...
      - name: Run unit tests
        run: go test -v ./...
      - name: Build WASM catalog
        run: go run ./scripts/build_catalog.go
